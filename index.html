<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>HUBGEO | Mapa Geotécnico de Angola</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--n:#0b2d4a;--n2:#12395a;--bg:#eef3f7;--line:#d8e3ea;--muted:#6d7f8c}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#183247}button,input,select{font:inherit}.hidden{display:none!important}#login{height:100%;display:grid;place-items:center;padding:20px}.card{width:min(430px,95vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 25px 70px #0b2d4a22}.brand{display:flex;gap:13px;align-items:center;margin-bottom:20px}.logo{width:56px;height:56px;border-radius:12px;background:var(--n);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;color:var(--n);font-size:22px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.side input,.side select{width:100%;padding:10px 11px;border:1px solid #cbd9e2;border-radius:9px;background:#fff}.primary{width:100%;padding:12px;border:0;border-radius:9px;background:var(--n);color:#fff;font-weight:800;cursor:pointer}.msg{min-height:18px;margin-top:10px;font-size:12px;color:#b43c3c}.secure{margin-top:14px;padding-top:12px;border-top:1px solid #edf2f5;color:var(--muted);font-size:11px;line-height:1.5}#app{height:100%;display:grid;grid-template-columns:330px 1fr;grid-template-rows:62px 1fr}.top{grid-column:1/-1;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:1000}.top strong{display:block;color:var(--n)}.top small{color:var(--muted)}.logout,.soft,.close{border:1px solid #cfdbe3;background:#fff;border-radius:8px;padding:8px 10px;color:var(--n);font-weight:700;cursor:pointer}.side{background:#fff;border-right:1px solid var(--line);padding:15px;overflow:auto}.side input,.side select{margin-bottom:8px}.filters{font-size:11px;text-transform:uppercase;font-weight:800;color:#6a7d8a;margin:3px 0 10px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.count{font-size:12px;color:var(--muted);margin:12px 0 8px}.list{display:grid;gap:7px}.item{padding:9px;border:1px solid #e1e9ee;border-radius:9px;cursor:pointer}.item:hover{background:#f8fbfd}.item strong{font-size:12px}.item small{display:block;margin-top:3px;color:#71828e}.mapwrap{position:relative}.map{height:100%;width:100%}.loading{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1100;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px}.modal{position:fixed;inset:0;background:#102c3d77;z-index:3000;display:grid;place-items:center;padding:16px}.modalcard{width:min(880px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:15px}.mhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;z-index:2}.mbody{padding:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv{border:1px solid #e2eaef;border-radius:8px;padding:9px}.kv span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}.kv b{font-size:12px}.sample{margin-top:10px;border:1px solid #e1e8ed;border-radius:9px;padding:10px}.sample h3{margin:0 0 8px;color:var(--n);font-size:13px}.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:58px 46vh 1fr}.top{grid-row:1}.mapwrap{grid-row:2}.side{grid-row:3;border-right:0;border-top:1px solid var(--line)}.grid{grid-template-columns:1fr 1fr}.sgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="login"><div class="card"><div class="brand"><div class="logo">HG</div><div><h1>HUBGEO</h1><p>Mapa Geotécnico de Angola</p></div></div><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="pass" type="password" autocomplete="current-password" required></div><button id="enter" class="primary">Entrar</button><div id="msg" class="msg"></div></form><div class="secure">Acesso restrito. A interface é pública, mas os dados geotécnicos só são retornados após autenticação e autorização no Supabase.</div></div></section>
<section id="app" class="hidden"><header class="top"><div><strong>HUBGEO · Mapa Geotécnico de Angola</strong><small>Base georreferenciada de resultados laboratoriais</small></div><div><span id="profile"></span> <button id="logout" class="logout">Sair</button></div></header><aside class="side"><div class="filters">Consulta</div><input id="search" placeholder="Ponto, obra, identificação..."><select id="prov"><option value="">Todas as províncias</option></select><select id="sucs"><option value="">Todos os SUCS</option></select><select id="aashto"><option value="">Todos os AASHTO</option></select><select id="cbr"><option value="">Todos os CBR</option><option value="lt10">&lt; 10%</option><option value="10-20">10–20%</option><option value="20-40">20–40%</option><option value="40-80">40–80%</option><option value="ge80">≥ 80%</option><option value="none">Sem dado</option></select><select id="status"><option value="valid">Válidos</option><option value="review">Em revisão</option><option value="all">Válidos + revisão</option></select><div class="btns"><button id="reset" class="soft">Limpar</button><button id="fit" class="soft">Enquadrar</button></div><div id="count" class="count">0 pontos</div><div id="list" class="list"></div></aside><main class="mapwrap"><div id="loading" class="loading hidden">Carregando base segura…</div><div id="map" class="map"></div></main></section>
<div id="modal" class="modal hidden"><div class="modalcard"><div class="mhead"><strong id="mtitle">Ponto</strong><div><button onclick="window.print()" class="soft">Imprimir / PDF</button> <button id="close" class="close">Fechar</button></div></div><div id="mbody" class="mbody"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb=window.supabase.createClient('https://wvsxddisigjrkzcxkqlk.supabase.co','sb_publishable_IcdeiPk0lW2UWP6KcD2VRA_balLiWhS',{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);let points=[],visible=[],map,layer;
const txt=v=>v===null||v===undefined||String(v).trim()===''?'—':String(v);const num=(v,d=1)=>{const x=Number(v);return Number.isFinite(x)?x.toFixed(d).replace(/\.0+$/,''):'—'};const color=p=>{const x=Number(p.cbr_medio_pct);if(!Number.isFinite(x))return'#546e7a';if(x<10)return'#c62828';if(x<20)return'#ef6c00';if(x<40)return'#f9a825';if(x<80)return'#2e7d32';return'#1565c0'};const kv=(a,b)=>'<div class="kv"><span>'+a+'</span><b>'+txt(b)+'</b></div>';
function initMap(){map=L.map('map').setView([-12.5,17.5],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map)}
async function loadPoints(){let out=[];for(let i=0;;i+=1000){const r=await sb.from('geo_points').select('id_ponto,provincia,utm_fuso,este_m,norte_m,latitude,longitude,qtde_amostras,fontes,obras,identificacoes,sucs_predominante,aashto_predominante,cbr_medio_pct,cbr_min_pct,cbr_max_pct,territorial_status').in('territorial_status',['valid','review']).order('id_ponto').range(i,i+999);if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)break}return out}
function fill(id,key){const s=$(id),vals=[...new Set(points.map(p=>p[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt'));for(const v of vals){const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)}}
function cbrOK(p,f){const x=Number(p.cbr_medio_pct),h=Number.isFinite(x);if(!f)return true;if(f==='none')return!h;if(!h)return false;if(f==='lt10')return x<10;if(f==='10-20')return x>=10&&x<20;if(f==='20-40')return x>=20&&x<40;if(f==='40-80')return x>=40&&x<80;return x>=80}
function apply(){const q=$('search').value.toLowerCase().trim(),pr=$('prov').value,su=$('sucs').value,aa=$('aashto').value,cb=$('cbr').value,st=$('status').value;visible=points.filter(p=>{const hay=[p.id_ponto,p.provincia,p.obras,p.fontes,p.identificacoes,p.sucs_predominante,p.aashto_predominante].filter(Boolean).join(' ').toLowerCase();const sok=st==='all'?p.territorial_status!=='excluded':p.territorial_status===st;return sok&&(!pr||p.provincia===pr)&&(!su||p.sucs_predominante===su)&&(!aa||p.aashto_predominante===aa)&&cbrOK(p,cb)&&(!q||hay.includes(q))});render()}
function render(){layer.clearLayers();for(const p of visible){if(!Number.isFinite(Number(p.latitude))||!Number.isFinite(Number(p.longitude)))continue;const m=L.circleMarker([p.latitude,p.longitude],{radius:6,weight:1,color:'#fff',fillColor:color(p),fillOpacity:.92}).addTo(layer);m.bindTooltip(p.id_ponto);m.on('click',()=>openPoint(p))}$('count').textContent=visible.length+' pontos';$('list').innerHTML=visible.slice(0,160).map(p=>'<div class="item" data-id="'+p.id_ponto+'"><strong>'+p.id_ponto+'</strong><small>'+txt(p.provincia)+' · '+txt(p.sucs_predominante)+' · CBR '+num(p.cbr_medio_pct)+'%</small></div>').join('');document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openPoint(points.find(p=>p.id_ponto===x.dataset.id)))}
async function openPoint(p){$('mtitle').textContent='Ponto '+p.id_ponto;$('modal').classList.remove('hidden');$('mbody').innerHTML='<p>Carregando resultados…</p>';const r=await sb.from('geo_samples').select('codigo_original,identificacao,prof_inicial_cm,prof_final_cm,ll,ip,ig,aashto,sucs,cbr_100_pct,expansao_pct,classificacao_visual,cor,fonte,obra').eq('id_ponto',p.id_ponto).order('prof_inicial_cm',{ascending:true});if(r.error){$('mbody').innerHTML='<p>Erro ao carregar amostras.</p>';return}const head='<div class="grid">'+kv('Província',p.provincia)+kv('SUCS predominante',p.sucs_predominante)+kv('AASHTO predominante',p.aashto_predominante)+kv('CBR médio',num(p.cbr_medio_pct)+'%')+kv('CBR mín./máx.',num(p.cbr_min_pct)+'% / '+num(p.cbr_max_pct)+'%')+kv('Amostras',r.data.length)+kv('Obra(s)',p.obras)+kv('Fonte(s)',p.fontes)+kv('Latitude / Longitude',num(p.latitude,6)+' / '+num(p.longitude,6))+'</div>';const sam=r.data.length?r.data.map((s,i)=>'<div class="sample"><h3>Amostra '+(i+1)+' · '+txt(s.codigo_original)+' · '+txt(s.identificacao)+'</h3><div class="sgrid">'+kv('Profundidade',num(s.prof_inicial_cm,0)+'–'+num(s.prof_final_cm,0)+' cm')+kv('SUCS',s.sucs)+kv('AASHTO',s.aashto)+kv('LL',num(s.ll))+kv('IP',s.ip)+kv('IG',num(s.ig))+kv('CBR 100%',num(s.cbr_100_pct)+'%')+kv('Expansão',num(s.expansao_pct)+'%')+kv('Classificação visual',s.classificacao_visual)+kv('Cor',s.cor)+kv('Fonte',s.fonte)+kv('Obra',s.obra)+'</div></div>').join(''):'<p>Sem amostras associadas.</p>';$('mbody').innerHTML=head+'<h3>Resultados laboratoriais</h3>'+sam}
async function boot(session){if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const p=await sb.from('app_users').select('role,active').eq('user_id',session.user.id).maybeSingle();if(p.error||!p.data||!p.data.active){await sb.auth.signOut();$('msg').textContent='Usuário sem autorização ativa.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('profile').textContent='Perfil: '+p.data.role;$('loading').classList.remove('hidden');if(!map)initMap();try{points=await loadPoints();fill('prov','provincia');fill('sucs','sucs_predominante');fill('aashto','aashto_predominante');apply()}catch(e){alert('Não foi possível carregar a base protegida.')}finally{$('loading').classList.add('hidden')}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('enter').disabled=true;$('msg').textContent='';const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});$('enter').disabled=false;if(r.error){$('msg').textContent='Credenciais inválidas ou acesso indisponível.';return}await boot(r.data.session)});$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};['search','prov','sucs','aashto','cbr','status'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',apply));$('reset').onclick=()=>{$('search').value='';$('prov').value='';$('sucs').value='';$('aashto').value='';$('cbr').value='';$('status').value='valid';apply()};$('fit').onclick=()=>{const c=visible.filter(p=>Number.isFinite(Number(p.latitude))&&Number.isFinite(Number(p.longitude))).map(p=>[p.latitude,p.longitude]);if(c.length)map.fitBounds(c,{padding:[25,25],maxZoom:13})};$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};sb.auth.getSession().then(({data})=>boot(data.session));
</script>
</body>
</html>
