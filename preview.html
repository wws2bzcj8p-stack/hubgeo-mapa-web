<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>HUBGEO | Prévia de revisão</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f7}
#appframe{display:block;width:100%;height:100%;border:0;background:#eef3f7}
</style>
</head>
<body>
<iframe id="appframe" src="index.html?preview=20260820" title="HUBGEO - Prévia"></iframe>
<script>
const frame=document.getElementById('appframe');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc||doc.querySelector('script[data-hubgeo-preview]'))return;
    const script=doc.createElement('script');
    script.src='branding.js?v=20260820-1';
    script.dataset.hubgeoPreview='true';
    doc.body.appendChild(script);
  }catch(e){
    console.error('Não foi possível carregar a prévia HUBGEO.',e);
  }
});
</script>
</body>
</html>
